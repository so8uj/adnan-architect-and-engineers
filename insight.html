<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ইনসাইট | Adnan Architects & Engineers</title>

  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="assets/css/tailwind.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/data.js"></script>

  <script defer src="assets/vendor/alpine-collapse.min.js"></script>
  <script defer src="assets/vendor/alpine.min.js"></script>
  <script defer src="assets/vendor/gsap.min.js"></script>
  <script defer src="assets/vendor/ScrollTrigger.min.js"></script>
  <script defer src="assets/vendor/lenis.min.js"></script>
  <script defer src="assets/js/app.js"></script>
</head>

<body class="font-sans text-ink-800 bg-white antialiased" x-data="insightPage()">

  <main>
    <section x-show="!a" x-cloak class="py-32 text-center">
      <p class="text-6xl">📄</p>
      <h1 class="mt-4 text-2xl font-bold">লেখাটি খুঁজে পাওয়া যায়নি</h1>
      <a href="insights.html" class="mt-6 inline-block rounded-full bg-brand-600 text-white font-semibold px-6 py-3">সব ইনসাইট দেখুন</a>
    </section>

    <template x-if="a">
      <div>
        <section data-page-hero class="relative overflow-hidden bg-white blueprint-light border-b border-gray-100">
          <div data-blob class="absolute -top-32 -right-32 h-96 w-96 rounded-full bg-brand-100/70"></div>
          <div class="relative mx-auto max-w-4xl px-4 py-14 lg:py-20">
            <nav data-ph class="text-sm text-gray-500">
              <a href="index.html" class="hover:text-brand-600">হোম</a><span class="mx-2">/</span>
              <a href="insights.html" class="hover:text-brand-600">ইনসাইট</a><span class="mx-2">/</span>
              <span class="text-ink-800" x-text="a.category"></span>
            </nav>
            <span data-ph class="mt-5 inline-block text-xs font-medium rounded-full bg-brand-600 text-white px-3 py-1" x-text="a.category"></span>
            <h1 data-ph class="mt-3 text-3xl sm:text-4xl lg:text-5xl font-bold leading-[1.45]" x-text="a.title"></h1>
            <p data-ph class="mt-4 text-sm text-gray-500" x-text="a.date + ' · ' + a.readTime + ' পড়া'"></p>
          </div>
        </section>

        <article class="py-12 lg:py-16">
          <div class="mx-auto max-w-3xl px-4">
            <div data-reveal class="rounded-2xl overflow-hidden border border-gray-100 bg-gray-50">
              <img :src="a.cover" :alt="a.title" class="w-full h-auto max-h-[28rem]"
                :class="a.coverFit === 'contain' ? 'object-contain bg-white p-3' : 'object-cover'">
            </div>

            <p class="mt-8 text-xl text-gray-700 leading-relaxed font-medium" x-text="a.excerpt"></p>

            <div class="mt-8 space-y-5 text-gray-700 leading-loose">
              <template x-for="(b, n) in a.body" :key="n">
                <div>
                  <h2 x-show="b.h" class="mt-6 text-2xl font-bold text-ink-800" x-text="b.h"></h2>
                  <p x-show="b.p" x-text="b.p"></p>
                  <ul x-show="b.ul" class="space-y-2">
                    <template x-for="li in (b.ul || [])" :key="li">
                      <li class="flex gap-3"><span class="mt-3 h-2 w-2 shrink-0 rounded-full bg-brand-600"></span><span x-text="li"></span></li>
                    </template>
                  </ul>
                </div>
              </template>
            </div>

            <div class="mt-12 rounded-3xl bg-gradient-to-br from-brand-600 to-brand-400 text-white p-8 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-5">
              <div>
                <h3 class="text-xl font-bold">আপনার প্রজেক্ট নিয়ে কথা বলতে চান?</h3>
                <p class="mt-1 text-white/90 text-sm">ফোন করুন অথবা ফর্ম পূরণ করুন, আমরা দ্রুত যোগাযোগ করব।</p>
              </div>
              <a href="index.html#contact" data-magnetic class="shrink-0 text-center rounded-full bg-white text-brand-700 font-semibold px-6 py-3 hover:bg-brand-50 transition">যোগাযোগ করুন</a>
            </div>
          </div>
        </article>

        <section x-show="others.length" class="pb-20 lg:pb-28 bg-gray-50 pt-16">
          <div class="mx-auto max-w-7xl px-4">
            <div class="flex items-end justify-between gap-4">
              <h2 class="text-2xl sm:text-3xl font-bold">আরও পড়ুন</h2>
              <a href="insights.html" class="font-semibold text-brand-600 hover:underline">সব ইনসাইট →</a>
            </div>
            <div class="mt-8 grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
              <template x-for="o in others" :key="o.slug">
                <a :href="'insight.html?p=' + o.slug"
                  class="group block rounded-2xl bg-white border border-gray-100 overflow-hidden hover:shadow-xl hover:-translate-y-1 transition duration-300">
                  <div class="img-zoom aspect-[16/10] overflow-hidden bg-gray-100">
                    <img :src="o.cover" :alt="o.title" loading="lazy" class="h-full w-full"
                      :class="o.coverFit === 'contain' ? 'object-contain p-2 bg-white' : 'object-cover'">
                  </div>
                  <div class="p-6">
                    <span class="rounded-full bg-brand-50 text-brand-700 text-xs font-medium px-3 py-1" x-text="o.category"></span>
                    <h3 class="mt-4 text-lg font-semibold leading-snug line-clamp-2 group-hover:text-brand-600 transition" x-text="o.title"></h3>
                    <p class="mt-2 text-sm text-gray-600 leading-relaxed line-clamp-3" x-text="o.excerpt"></p>
                  </div>
                </a>
              </template>
            </div>
          </div>
        </section>
      </div>
    </template>
  </main>

  <script>
    function insightPage() {
      const slug = new URLSearchParams(location.search).get('p');
      const list = window.INSIGHTS;
      const idx = list.findIndex(x => x.slug === slug);
      return {
        a: idx > -1 ? list[idx] : null,
        others: list.filter((_, j) => j !== idx).slice(0, 3),
        init() { if (this.a) document.title = this.a.title + ' | Adnan Architects & Engineers'; },
      };
    }
  </script>
  <script src="assets/js/layout.js"></script>
</body>

</html>
