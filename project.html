<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>প্রজেক্ট | Adnan Architects & Engineers</title>

  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="assets/css/tailwind.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/data.js"></script>

  <script defer src="assets/vendor/alpine-collapse.min.js"></script>
  <script defer src="assets/vendor/alpine.min.js"></script>
  <script defer src="assets/vendor/gsap.min.js"></script>
  <script defer src="assets/vendor/ScrollTrigger.min.js"></script>
  <script defer src="assets/vendor/lenis.min.js"></script>
  <script defer src="assets/js/app.js"></script>
</head>

<body class="font-sans text-ink-800 bg-white antialiased" x-data="projectPage()" @keydown.window="onKey($event)">

  <main>
    <!-- Not found -->
    <section x-show="!project" x-cloak class="py-32 text-center">
      <p class="text-6xl">🏗️</p>
      <h1 class="mt-4 text-2xl font-bold">প্রজেক্টটি খুঁজে পাওয়া যায়নি</h1>
      <a href="portfolio.html" class="mt-6 inline-block rounded-full bg-brand-600 text-white font-semibold px-6 py-3">সব প্রজেক্ট
        দেখুন</a>
    </section>

    <template x-if="project">
      <div>
        <!-- Page header -->
        <section data-page-hero class="relative overflow-hidden bg-ink-950 text-white blueprint">
          <div data-blob class="absolute -top-32 -right-32 h-96 w-96 rounded-full bg-brand-600/30 blur-3xl"></div>
          <div class="relative mx-auto max-w-7xl px-4 py-14 lg:py-20">
            <nav data-ph class="text-sm text-gray-400">
              <a href="index.html" class="hover:text-white">হোম</a><span class="mx-2">/</span>
              <a href="portfolio.html" class="hover:text-white">আমাদের কাজ</a><span class="mx-2">/</span>
              <span class="text-white" x-text="project.category"></span>
            </nav>
            <span data-ph class="mt-5 inline-block text-xs font-medium rounded-full bg-brand-600 px-3 py-1"
              x-text="project.category"></span>
            <h1 data-ph class="mt-3 max-w-3xl text-3xl sm:text-5xl font-bold leading-tight" x-text="project.title"></h1>
            <p data-ph class="mt-4 max-w-2xl text-gray-300 text-lg" x-text="project.summary"></p>
          </div>
        </section>

        <!-- Gallery + sidebar -->
        <section class="py-14 lg:py-20">
          <div class="mx-auto max-w-7xl px-4 grid lg:grid-cols-3 gap-10">
            <div class="lg:col-span-2">
              <div class="grid gap-5" :class="project.images.length > 1 ? 'sm:grid-cols-2' : ''">
                <template x-for="(img, i) in project.images" :key="img.src">
                  <figure data-reveal class="group" :class="project.images.length === 1 && 'max-w-2xl mx-auto w-full'">
                    <button type="button" @click="openLb(i)"
                      class="relative block w-full overflow-hidden rounded-2xl border border-gray-100 bg-white shadow-sm hover:shadow-xl transition-shadow duration-500 text-left cursor-zoom-in">
                      <div class="img-zoom overflow-hidden">
                        <img :src="img.src" :alt="img.title" loading="lazy" class="w-full h-auto">
                      </div>
                      <span
                        class="absolute top-3 right-3 grid place-items-center h-9 w-9 rounded-full bg-ink-950/70 text-white opacity-0 group-hover:opacity-100 transition">
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                          <path stroke-linecap="round" d="M21 21l-4.3-4.3M11 8v6M8 11h6M17 11a6 6 0 11-12 0 6 6 0 0112 0z" />
                        </svg>
                      </span>
                    </button>
                    <figcaption class="mt-3 px-1">
                      <div class="flex flex-wrap items-center gap-2">
                        <h3 class="font-semibold" x-text="img.title"></h3>
                        <span class="text-xs font-medium rounded-full bg-brand-50 text-brand-700 px-2.5 py-0.5"
                          x-text="img.size"></span>
                      </div>
                      <p class="mt-1 text-sm text-gray-600 leading-relaxed" x-text="img.note"></p>
                    </figcaption>
                  </figure>
                </template>
              </div>

              <!-- Description -->
              <div class="mt-14" data-reveal>
                <h2 class="text-2xl font-bold">প্রজেক্ট বিবরণ</h2>
                <div class="mt-4 space-y-4 text-gray-600 leading-relaxed">
                  <template x-for="para in project.description" :key="para">
                    <p x-text="para"></p>
                  </template>
                </div>

                <h3 class="mt-8 text-lg font-semibold">বিশেষ দিক</h3>
                <ul class="mt-4 grid sm:grid-cols-2 gap-3">
                  <template x-for="h in project.highlights" :key="h">
                    <li class="flex gap-3 rounded-xl bg-gray-50 p-4">
                      <span
                        class="mt-0.5 grid place-items-center h-5 w-5 shrink-0 rounded-full bg-brand-600 text-white">
                        <svg class="h-3 w-3" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                        </svg>
                      </span>
                      <span class="text-sm" x-text="h"></span>
                    </li>
                  </template>
                </ul>
              </div>
            </div>

            <!-- Sidebar -->
            <aside class="lg:sticky lg:top-24 self-start" data-reveal>
              <div class="rounded-3xl border border-gray-100 bg-white shadow-lg p-6">
                <h2 class="text-lg font-bold">প্রজেক্ট তথ্য</h2>
                <dl class="mt-4 divide-y divide-gray-100">
                  <template x-for="m in project.meta" :key="m.label">
                    <div class="py-3 flex justify-between gap-4 text-sm">
                      <dt class="text-gray-500" x-text="m.label"></dt>
                      <dd class="font-medium text-right" x-text="m.value"></dd>
                    </div>
                  </template>
                </dl>
                <a href="index.html#contact" data-magnetic
                  class="mt-6 block text-center rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3.5 transition">এমন
                  নকশা করাতে চাই</a>
                <a href="tel:01673092580"
                  class="mt-3 block text-center rounded-xl border border-gray-200 hover:border-brand-500 hover:text-brand-600 font-semibold py-3.5 transition">📞
                  01673092580</a>
              </div>
            </aside>
          </div>
        </section>

        <!-- Other projects -->
        <section x-show="others.length" class="pb-20 lg:pb-28 bg-gray-50 pt-16">
          <div class="mx-auto max-w-7xl px-4">
            <h2 class="text-2xl sm:text-3xl font-bold" data-reveal>আরও প্রজেক্ট</h2>
            <div class="mt-8 grid md:grid-cols-2 gap-6">
              <template x-for="p in others" :key="p.slug">
                <a :href="'project.html?p=' + p.slug" data-reveal
                  class="group relative block rounded-3xl overflow-hidden bg-gray-100 shadow-sm hover:shadow-2xl transition-shadow duration-500">
                  <div class="img-zoom aspect-[16/10] overflow-hidden">
                    <img :src="p.cover" :alt="p.title" loading="lazy" class="h-full w-full object-cover"
                      :style="'object-position:' + p.coverPos">
                  </div>
                  <div class="absolute inset-0 bg-gradient-to-t from-ink-950/90 via-ink-950/20 to-transparent"></div>
                  <div class="absolute bottom-0 inset-x-0 p-6 text-white">
                    <span class="text-xs font-medium rounded-full bg-brand-600 px-3 py-1" x-text="p.category"></span>
                    <h3 class="mt-3 text-xl font-bold" x-text="p.title"></h3>
                  </div>
                </a>
              </template>
            </div>
          </div>
        </section>
      </div>
    </template>
  </main>

  <!-- Lightbox -->
  <div x-show="lb.open" x-cloak x-transition.opacity.duration.250ms data-lenis-prevent
    class="fixed inset-0 z-[90] bg-black/90 flex flex-col" role="dialog" aria-modal="true" @click.self="closeLb()">
    <template x-if="project">
      <div class="flex flex-col h-full" @click.self="closeLb()">
        <div class="flex items-center justify-between px-4 py-3 text-white">
          <span class="text-sm text-gray-300"
            x-text="(lb.i+1).toLocaleString('bn-BD') + ' / ' + project.images.length.toLocaleString('bn-BD')"></span>
          <button @click="closeLb()" class="text-3xl leading-none px-2" aria-label="বন্ধ করুন">&times;</button>
        </div>
        <div class="relative flex-1 min-h-0 flex items-center justify-center px-4 sm:px-16" @click.self="closeLb()">
          <button x-show="project.images.length > 1" @click="prev()"
            class="absolute left-2 sm:left-5 z-10 grid place-items-center h-11 w-11 rounded-full bg-white/10 hover:bg-brand-600 text-white transition"
            aria-label="আগের ছবি">‹</button>
          <img x-ref="lbimg" :src="project.images[lb.i].src" :alt="project.images[lb.i].title"
            class="max-h-full max-w-full object-contain rounded-lg bg-white">
          <button x-show="project.images.length > 1" @click="next()"
            class="absolute right-2 sm:right-5 z-10 grid place-items-center h-11 w-11 rounded-full bg-white/10 hover:bg-brand-600 text-white transition"
            aria-label="পরের ছবি">›</button>
        </div>
        <div class="px-4 py-4 text-center text-white">
          <p class="font-semibold" x-text="project.images[lb.i].title + ' — ' + project.images[lb.i].size"></p>
          <p class="text-sm text-gray-300" x-text="project.images[lb.i].note"></p>
        </div>
      </div>
    </template>
  </div>

  <script>
    function projectPage() {
      const slug = new URLSearchParams(location.search).get('p');
      const list = window.PROJECTS;
      const idx = list.findIndex(p => p.slug === slug);
      return {
        project: idx > -1 ? list[idx] : null,
        others: list.filter((_, j) => j !== idx),
        lb: { open: false, i: 0 },

        init() {
          if (this.project) document.title = this.project.title + ' | Adnan Architects & Engineers';
          this.$watch('lb.open', (v) => { window.__lenis && (v ? window.__lenis.stop() : window.__lenis.start()); });
          this.$watch('lb.i', () => this.$nextTick(() => {
            if (window.gsap && this.$refs.lbimg) gsap.fromTo(this.$refs.lbimg, { opacity: 0, scale: .96 }, { opacity: 1, scale: 1, duration: .4, ease: 'power3.out' });
          }));
        },
        openLb(i) { this.lb.i = i; this.lb.open = true; },
        closeLb() { this.lb.open = false; },
        next() { this.lb.i = (this.lb.i + 1) % this.project.images.length; },
        prev() { this.lb.i = (this.lb.i - 1 + this.project.images.length) % this.project.images.length; },
        onKey(e) {
          if (!this.lb.open) return;
          if (e.key === 'Escape') this.closeLb();
          if (e.key === 'ArrowRight') this.next();
          if (e.key === 'ArrowLeft') this.prev();
        },
      };
    }
  </script>
  <script src="assets/js/layout.js"></script>
</body>

</html>
